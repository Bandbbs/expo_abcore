[package]
name = "expo_abcore"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "expo_abcore"
crate-type = ["staticlib", "cdylib"]

[dependencies]
anyhow = "1.0.100"
corelib = { path = "vendor/core", default-features = false }
jni = "0.21.1"
libc = "0.2"
log = "0.4"
once_cell = "1.21"
parking_lot = "0.12"
pb = { path = "vendor/pb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
zip = "0.6.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
